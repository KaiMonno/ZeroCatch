name: Scrape leads

on:
  schedule:
    # Vercel Cron (vercel.json) dispatches the main run at ~08:48 UTC. GitHub
    # fires this one 5-10 hours late, which makes it a useful second pass:
    # it catches blog posts from the US morning (34 extra leads, Oct-Nov 2026).
    # Runs are idempotent, and leads already judged are never judged again.
    - cron: "5 8 * * *"
  workflow_dispatch: # "Run workflow" button for manual runs
    inputs:
      judge_check:
        description: "Dry run: print AI verdicts on current leads, write nothing (~$0.01)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install AI judge SDK
        run: pip install "anthropic>=1,<2"

      # Unit tests run in CI (ci.yml) on every push, not here: a broken test
      # should fail a pull request, never block a night of deals.

      - name: Scrape, judge and publish
        if: ${{ !inputs.judge_check }}
        run: python -m scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Without this secret the judge is off and leads go to the review queue.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repository variable: "off", "shadow" (record verdicts only) or "publish".
          AI_JUDGE_MODE: ${{ vars.AI_JUDGE_MODE || 'shadow' }}
          # Emails the admin when leads are queued for review; skipped unless both are set.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REVIEW_NOTIFY_EMAIL: ${{ secrets.REVIEW_NOTIFY_EMAIL }}

      - name: Send deal alerts
        # Runs even if a source failed: whatever was published is already saved.
        if: ${{ !cancelled() && !inputs.judge_check }}
        run: python -m scrapers.alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Without these two secrets the step skips quietly.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_SIGNING_SECRET: ${{ secrets.ALERTS_SIGNING_SECRET }}

      - name: Judge check (dry run, nothing written)
        if: ${{ inputs.judge_check }}
        run: python -m scrapers --dry-run --judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
