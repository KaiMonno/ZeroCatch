# Recurring no-purchase food freebies. The calendar source turns each entry
# into a pre-filled review-queue lead `lead_days` before it happens; you
# confirm the brand is running it this year, then click Publish.
#
# Date forms:
#   date = "07-11"                         fixed month-day every year
#   date = "first friday of june"          nth weekday of a month
#   date = "~03-19"                        varies by year: "~" = approximate; the
#                                          lead says to confirm the real date
#
# Inclusion bar (same as the rest of ZeroCatch): free with no purchase and no
# paid membership. `verified` records the last year it was confirmed.

[[event]]
key = "ihop-pancake-day"
merchant = "IHOP"
title = "Free Short Stack on National Pancake Day"
description = "One free short stack of buttermilk pancakes per guest, dine-in at participating IHOPs (typically 7am–8pm). No purchase needed; IHOP invites an optional charity donation."
url = "https://www.ihop.com/en/national-pancake-day"
date = "~03-03"
verified = "2026-03-03: free short stack, dine-in, no minimum purchase (FOX LA)"

