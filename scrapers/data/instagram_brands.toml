# Instagram brand accounts to watch (Meta Graph API "business discovery").
# Only Business/Creator accounts can be read; a wrong or non-business handle is
# reported by `python -m scrapers.instagram --check`. Handles below are best
# guesses: fix any the check flags. `url` is where the lead links, since
# Instagram captions can't carry clickable links.

[[brand]]
handle = "dunkin"
merchant = "Dunkin'"
url = "https://www.dunkindonuts.com/en/dunkin-rewards"

