# Curated Instant-Cancel Trials (Tab 2). Adding an entry here IS the approval:
# the nightly job publishes everything in this file and unpublishes anything
# removed from it. Only list trials you can cancel right after signing up while
# keeping the full trial period. Re-check `verified` every few months.
#
# Rejected (do not add): cancelling during the trial ends access immediately.
# - Spotify Premium: spotify.com/us/legal/premium-promotional-offer-terms (2026-10-04)
