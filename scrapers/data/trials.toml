# Curated Instant-Cancel Trials (Tab 2). Adding an entry here IS the approval:
# the nightly job publishes everything in this file and unpublishes anything
# removed from it. Only list trials you can cancel right after signing up while
# keeping the full trial period. Re-check `verified` every few months.
#
# Rejected (do not add): cancelling during the trial ends access immediately.
# - Spotify Premium: spotify.com/us/legal/premium-promotional-offer-terms (2026-10-04)
# - LinkedIn Premium: linkedin.com/help/linkedin/answer/a545578 (2026-10-05)
# - Walmart+: Walmart+ terms, "free-trial cancellations end access immediately" (2026-10-05)
# - DashPass: DoorDash help, cancelling during a trial ends benefits immediately (2026-10-28)
# - Grubhub+: terms, cancelling during the trial means immediate termination (2026-10-28)
# - Uber One: benefits end when you cancel, except some partner promos (2026-10-28)
# Not listed until official terms confirm access continues after cancelling (2026-10-28):
#   Instacart+, Philo, Paramount+, Everand/Scribd, Google One (only partner-offer terms found).
#   Dropbox Plus: help page says a card signup keeps the trial, but no individual
#   free trial is currently offered on dropbox.com/plans.
# Removed: Hulu (no longer offers a free trial, 2026-10-12).
# Not offered: GitHub Copilot Pro (trials paused since 2026-04-10, "temporary",
#   github.blog/changelog/2026-04-10-pausing-new-github-copilot-pro-trials). The
#   docs say cancelling keeps access to the trial end, so re-check and add if it returns.

[[trial]]
key = "amazon-prime"
merchant = "Amazon"
title = "Amazon Prime: 30-Day Free Trial"
description = "Free shipping, Prime Video and more for 30 days. Card required at signup. End the trial right away from Manage Prime Membership and keep Prime until the trial end date, with no charge."
url = "https://www.amazon.com/amazonprime"
duration_days = 30
requires_credit_card = true
verified = "2026-10-04: 30-day trial; cancelling keeps access until trial end (third-party guides; Amazon help page unreachable when checked)"

